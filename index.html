<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>CASH STREAM | Cargando...</title>
    <style>
        /* Usando los colores que extrajiste del HTML original */
        body {
            background-color: #16202d; 
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ea6d6d; /* El color rojo que vimos en el código */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .text {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .btn-manual {
            margin-top: 30px;
            padding: 12px 25px;
            background-color: #ea6d6d;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            display: none; /* Solo se muestra si falla el redireccionamiento */
        }
    </style>
    
    <script>
        // CONFIGURACIÓN: Pega aquí tu link de referido
        const URL_REFERIDO = "TU_LINK_DE_REFERIDO_AQUÍ";

        function redirect() {
            setTimeout(() => {
                window.location.href = URL_REFERIDO;
            }, 1500); // Espera 1.5 segundos para que parezca que la "IA" está procesando
        }

        // Si tarda mucho, mostramos el botón manual
        setTimeout(() => {
            document.getElementById('btnManual').style.display = 'block';
        }, 5000);
    </script>
</head>
<body onload="redirect()">

    <div class="loader"></div>
    <div class="text">VERIFICANDO CONEXIÓN SEGURA...</div>
    <p style="color: #4291f1; font-size: 12px;">Buscando mejores bonos en MXN...</p>

    <a id="btnManual" href="#" onclick="location.href=URL_REFERIDO" class="btn-manual">
        ENTRAR AHORA
    </a>

</body>
</html>
