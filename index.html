<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MONEY MAGNET GAMES 💰</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold: #ffcc00;
            --dark-bg: #0f1216;
            --card-bg: #1a1e23;
            --accent: #bd19d1;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            user-select: none;
        }

        /* HEADER */
        .header {
            background-color: var(--card-bg);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d323a;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .balance-container {
            background: #000;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
        }

        .balance { color: var(--gold); font-weight: bold; font-size: 18px; margin-right: 10px; }

        /* LOBBY */
        .main-container { padding: 15px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #3b424b;
            cursor: pointer;
        }
        .game-card img { width: 100%; border-radius: 8px; margin-bottom: 5px; }

        /* FRUIT SLOTS GAME */
        #fruit-game { display: none; padding: 15px; background: #000; min-height: 100vh; }
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: #1a1e23;
            padding: 15px;
            border-radius: 15px;
            border: 3px solid var(--gold);
            margin: 20px 0;
        }
        .slot-item {
            background: #0f1216;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .slot-item img { width: 35px; height: 35px; }
        .active-slot { border-color: var(--gold); box-shadow: 0 0 15px var(--gold); background: #2d323a; }

        /* MODAL */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: linear-gradient(135deg, #1e272e, #000);
            width: 80%; padding: 30px; border-radius: 20px; border: 2px solid var(--gold);
        }
        .btn-action {
            background: var(--gold); color: black; border: none; padding: 12px;
            border-radius: 25px; font-weight: bold; width: 100%; margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="header">
            <div style="color:var(--gold); font-weight:bold;">MONEY MAGNET 🧲</div>
            <div class="balance-container">
                <div class="balance">$ <span id="saldo-txt">500.00</span></div>
            </div>
        </div>
        <div class="main-container">
            <h2 style="color:var(--gold)">🎰 SALA VIP</h2>
            <div class="grid">
                <div class="game-card" onclick="openFruitGame()">
                    <img src="https://img.icons8.com/emoji/96/cherry-emoji.png">
                    <span>Fruit Slots</span>
                </div>
                <div class="game-card" onclick="alert('Próximamente...')">
                    <img src="https://img.icons8.com/color/96/diamond--v1.png">
                    <span>Gems</span>
                </div>
                <div class="game-card" onclick="alert('Próximamente...')">
                    <img src="https://img.icons8.com/color/96/poker-cards.png">
                    <span>Poker</span>
                </div>
            </div>
        </div>
    </div>

    <div id="fruit-game">
        <button onclick="backToLobby()" style="background:none; color:white; border:none; float:left; font-size:20px;">⬅️</button>
        <h2 style="color:var(--gold)">FRUIT SLOTS 🍒</h2>
        
        <div class="slot-grid" id="tablero">
            <div class="slot-item"><img src="https://img.icons8.com/emoji/48/cherry-emoji.png"></div>
            <div class="slot-item"><img src="https://img.icons8.com/emoji/48/apple-emoji.png"></div>
            <div class="slot-item"><img src="https://img.icons8.com/emoji/48/tangerine-emoji.png"></div>
            <div class="slot-item"><img src="https://img.icons8.com/color/48/bell.png"></div>
            <div class="slot-item"><img src="https://img.icons8.com/emoji/48/grapes-emoji.png"></div>
            <div class="slot-item"><img src="https://img.icons8.com/color/48/star--v1.png"></div>
            <div class="slot-item"><img src="https://img.icons8.com/emoji/48/watermelon-emoji.png"></div>
            <div class="slot-item"><img src="https://img.icons8.com/color/48/diamond--v1.png"></div>
            <div class="slot-item"><img src="https://img.icons8.com/emoji/48/lemon-emoji.png"></div>
            <div class="slot-item"><img src="https://img.icons8.com/color/48/number-7.png"></div>
            <div class="slot-item"><img src="https://img.icons8.com/emoji/48/cherry-emoji.png"></div>
            <div class="slot-item"><img src="https://img.icons8.com/color/48/bell.png"></div>
        </div>

        <button class="btn-action" id="btn-spin" onclick="spinFruit()" style="font-size:20px;">¡GIRAR! 🎰</button>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content" id="modal-body"></div>
    </div>

    <script>
        const tele = window.Telegram.WebApp;
        tele.expand();

        let saldo = 500.00;
        const horaInicio = localStorage.getItem('casino_start') || Date.now();
        if(!localStorage.getItem('casino_start')) localStorage.setItem('casino_start', horaInicio);

        function updateDisplay() {
            document.getElementById('saldo-txt').innerText = saldo.toFixed(2);
        }

        function openFruitGame() {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('fruit-game').style.display = 'block';
        }

        function backToLobby() {
            document.getElementById('lobby').style.display = 'block';
            document.getElementById('fruit-game').style.display = 'none';
        }

        function spinFruit() {
            if (saldo < 10) {
                showModal("SALDO AGOTADO ❌", 0, false, "Para seguir ganando, recarga en soporte.");
                return;
            }

            const btn = document.getElementById('btn-spin');
            btn.disabled = true;
            const items = document.querySelectorAll('.slot-item');
            let i = 0;

            const loop = setInterval(() => {
                items.forEach(el => el.classList.remove('active-slot'));
                items[Math.floor(Math.random() * items.length)].classList.add('active-slot');
                i++;
                if (i > 12) {
                    clearInterval(loop);
                    btn.disabled = false;
                    processResult();
                }
            }, 100);
        }

        function processResult() {
            const transcurrido = Date.now() - horaInicio;
            let prob = transcurrido < 3600000 ? 0.8 : (transcurrido < 7200000 ? 0.4 : 0.05);
            
            const win = Math.random() < prob;
            const amount = Math.floor(Math.random() * 300) + 50;

            if (win) {
                saldo += amount;
                showModal("¡ENHORABUENA! 🔥", amount, true, "Usted ha ganado");
            } else {
                saldo -= amount;
                if(saldo < 0) saldo = 0;
                showModal("PERDISTE ❌", amount, false, "Sigue intentando");
            }
            updateDisplay();
        }

        function showModal(title, amount, isWin, txt) {
            const modal = document.getElementById('modal');
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h2 style="color:${isWin?'#ffcc00':'#ff4d4d'}">${title}</h2>
                <p>${txt}</p>
                <h1 style="font-size:40px;">${isWin?'+':'-'} $${amount}</h1>
                <button class="btn-action" onclick="document.getElementById('modal').style.display='none'">CONFIRMAR</button>
            `;
            modal.style.display = 'flex';
        }

        updateDisplay();
    </script>
</body>
</html>
