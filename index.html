<script>
    function toggleBot() {
        const bot = document.getElementById('casino-bot');
        const launcher = document.getElementById('bot-launcher');
        if (bot.style.display === 'none') {
            bot.style.display = 'block';
            launcher.style.display = 'none';
        } else {
            bot.style.display = 'none';
            launcher.style.display = 'flex';
        }
    }

    // Mensajes automáticos de recomendación
    const chatContent = document.getElementById('chat-content');
    const tips = [
        "🔥 <b>TIP:</b> Los retiros por SPEI están tardando menos de 10 minutos hoy.",
        "🎁 <b>BONO:</b> Si te registras ahora, tienes bonos ilimitados en camino.",
        "⭐ ¡Erick está en línea para ayudarte con tu primera recarga!",
        "🚀 <b>➡️ CLIC EN EL BOTÓN DORADO</b> para entrar a la plataforma oficial."
    ];
    
    let currentTip = 0;
    setTimeout(() => {
        const interval = setInterval(() => {
            if (currentTip < tips.length) {
                const msg = document.createElement('p');
                msg.innerHTML = tips[currentTip];
                msg.style.borderLeft = "3px solid #d4af37";
                msg.style.paddingLeft = "10px";
                msg.style.marginTop = "15px";
                chatContent.appendChild(msg);
                chatContent.scrollTop = chatContent.scrollHeight;
                currentTip++;
            } else {
                clearInterval(interval);
            }
        }, 4000);
    }, 2000);
</script>
