<!DOCTYPE html>

      <link rel="stylesheet" href="css/responsive.css">
      <link rel="icon" href="images/fevicon.png" type="image/gif" />
      <link rel="stylesheet" href="css/jquery.mCustomScrollbar.min.css">
      <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/2.1.5/jquery.fancybox.min.css" media="screen">
      
      <style>
         .mm-screen { display: none; width: 100%; min-height: 100vh; flex-direction: column; align-items: center; background: #0a0b0d; color: white; position: fixed; top: 0; left: 0; z-index: 99999; overflow-y: auto; padding-bottom: 20px;}
         .mm-active { display: flex; }
         .top-bar { width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100;}
         .bal-box { background: #000; border: 1px solid #ffcc00; color: #ffcc00; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
         
         /* Carga Ta Da */
         .tada-logo { font-size: 50px; font-weight: 900; color: #ff8800; margin-top: 40vh; text-shadow: 0 0 20px rgba(255,136,0,0.5); }
         .progress-bar-container { width: 70%; height: 8px; background: #222; border-radius: 4px; overflow: hidden; margin-top: 20px; }
         .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00ffff, #0088ff); transition: width 0.2s; }
         
         /* Juego */
         .slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: #1a1d23; padding: 15px; border-radius: 20px; border: 2px solid #333; width: 90%; margin-top: 20px;}
         .cell { background: #0d0f12; aspect-ratio: 1/1; border-radius: 10px; display: flex; justify-content: center; align-items: center; border: 1px solid #222; }
         .cell img { width: 80%; height: 80%; object-fit: contain; }
         .controls { width: 90%; background: #151515; border-radius: 15px; padding: 15px; margin-top: 20px; border: 1px solid #222; }
         .bet_btn { background: #222; border: none; color: white; width: 35px; height: 35px; border-radius: 8px; font-size: 20px; }
         .spin_btn { background: #00ff88; color: black; border: none; width: 80px; height: 80px; border-radius: 15px; font-weight: 900; font-size: 20px; margin-left: 15px; }

         /* Modal */
         .mm-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999999; justify-content: center; align-items: center; }
         .mm-modal-content { background: #111; width: 85%; border-radius: 25px; padding: 30px; border: 2px solid #ffcc00; text-align: center; }
         .confirm_btn { background: #ffcc00; color: black; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; margin-top: 20px; font-size: 18px;}
      </style>
   </head>

                  <li><a href="#about">About</a></li>
                  <li><a href="#game">Game</a></li>
                  <li><a href="#customer">Our customer</a></li>
                  <li><a href="#contact">Contact</a></li>
               </ul>
            </nav>
         </div>
         <div id="content">
            <header>

                        <div class="row">

                                 </div>
                              </div>
                           </div>
                           <div class="col-md-9">
                              <div class="right_header_info">
                                 <ul>

                                          $ <span class="bal_val">1088.00</span> MXN

                                    </li>
                                    <li>
                                       <button type="button" id="sidebarCollapse">
                                       <img src="images/menu_icon.png" alt="#" />
                                       </button>
                                    </li>
                                 </ul>
                              </div>
                           </div>
                        </div>
                     </div>

               </div>
            </header>
            
            <section class="slider_section">

         <div id="game" class="casino">

               <div class="row">

      <div id="mm-loading" class="mm-screen">

      <div id="mm-game-screen" class="mm-screen">
         <div class="top-bar">
             <button onclick="closeGame()" style="background:none; border:none; color:white; font-size:24px;">⬅️</button>
             <div class="bal-box">$ <span class="bal_val">1088.00</span></div>
         </div>
         
         <h1 id="active-game-title" style="color:#ffcc00; margin-top:20px;">Juego</h1>
         
         <div class="slot-grid" id="mm_board">
             </div>

         <div class="controls">
             <div style="display:flex; align-items:center; justify-content:space-between;">
                 <div style="display:flex; align-items:center; background:#000; padding:5px 15px; border-radius:10px; border:1px solid #333; flex:1;">
                     <button class="bet_btn" onclick="adjBet(-5)">-</button>
                     <div style="flex:1; text-align:center;">
                        <span style="font-weight:bold; color:#ffcc00; font-size:22px;">$ <span id="bet_val">10</span></span><br>
                        <small style="font-size:10px; color:#555;">APUESTA MAX $50</small>
                     </div>
                     <button class="bet_btn" onclick="adjBet(5)">+</button>
                 </div>
                 <button class="spin_btn" onclick="spinFS()">IR</button>
             </div>
         </div>
      </div>

      <div id="mm_win_modal" class="mm-modal">
         <div class="mm-modal-content">
             <h2 style="color:#ffcc00; font-size:32px; font-weight:900; margin:0;">¡ENHORABUENA!</h2>
             <p style="color:#888; margin:10px 0;">Ganancia Épica</p>
             <h1 style="font-size:50px; margin:20px 0; color:white;">+ $<span id="win_amt">0.00</span></h1>
             <button class="confirm_btn" onclick="document.getElementById('mm_win_modal').style.display='none'">RECOGER</button>
         </div>
      </div>

      <script src="js/jquery.min.js"></script>
      <script src="js/popper.min.js"></script>
      <script src="js/bootstrap.bundle.min.js"></script>
      <script src="js/jquery.mCustomScrollbar.concat.min.js"></script>
      <script src="js/custom.js"></script>
      
      <script>
         // Inicializar Telegram WebApp
         const tg = window.Telegram.WebApp;
         tg.expand();

         let saldo = 1088.00;
         let bet = 10;
         const start = localStorage.getItem('mm_start') || Date.now();
         if(!localStorage.getItem('mm_start')) localStorage.setItem('mm_start', start);

         function updateUI() {
             document.querySelectorAll('.bal_val').forEach(el => el.innerText = saldo.toFixed(2));
             document.getElementById('bet_val').innerText = bet;
         }

         function adjBet(v) {
             bet += v;
             if(bet < 5) bet = 5; if(bet > 50) bet = 50;
             updateUI();
         }

         function openGame(title) {
             // Ocultar la página web normal
             document.getElementById('main-website').style.display = 'none';
             document.getElementById('mm-loading').classList.add('mm-active');
             
             let p = 0;
             const bar = document.getElementById('load_bar');
             const txt = document.getElementById('load_txt');

             const loop = setInterval(() => {
                 p += Math.floor(Math.random()*20)+5;
                 if(p >= 100) {
                     p = 100;
                     clearInterval(loop);
                     setTimeout(() => {
                         document.getElementById('mm-loading').classList.remove('mm-active');
                         document.getElementById('mm-game-screen').classList.add('mm-active');
                         document.getElementById('active-game-title').innerText = title;
                         initBoard();
                     }, 500);
                 }
                 bar.style.width = p + '%';
                 txt.innerText = `Cargando recursos 3D... ${p}%`;
             }, 150);
         }

         function closeGame() {
             document.getElementById('mm-game-screen').classList.remove('mm-active');
             document.getElementById('main-website').style.display = 'block';
         }

         function initBoard() {
             const board = document.getElementById('mm_board');
             board.innerHTML = '';
             for(let i=0; i<16; i++) {
                 // Usa tu imagen slot.png o iconos de respaldo
                 board.innerHTML += `<div class="cell"><img src="slot.png" onerror="this.src='https://img.icons8.com/emoji/48/cherry-emoji.png'"></div>`;
             }
         }

         function spinFS() {
             if(saldo < bet) { alert("Saldo insuficiente. Recargue su cuenta en soporte."); return; }
             saldo -= bet;
             updateUI();
             
             const cells = document.querySelectorAll('.cell');
             let count = 0;
             const timer = setInterval(() => {
                 cells.forEach(c => c.style.borderColor = '#222');
                 cells[Math.floor(Math.random()*cells.length)].style.borderColor = '#ffcc00';
                 count++;
                 if(count > 15) {
                     clearInterval(timer);
                     checkWin();
                 }
             }, 80);
         }

         function checkWin() {
             const diff = Date.now() - start;
             // Algoritmo de 4 horas
             let prob = diff < 3600000 ? 0.75 : (diff < 14400000 ? 0.25 : 0.02);
             
             if(Math.random() < prob) {
                 const win = bet * (Math.floor(Math.random()*8)+2);
                 saldo += win;
                 document.getElementById('win_amt').innerText = win.toFixed(2);
                 document.getElementById('mm_win_modal').style.display = 'flex';
                 updateUI();
             }
         }

         updateUI();
      </script>
