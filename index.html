<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MONEY MAGNET GAMES 💰</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #0a0b0d;
            --card-bg: #14161b;
            --gold: #fbc02d;
            --green-btn: #2ecc71;
            --border-gray: #2c2e33;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Roboto', sans-serif;
            margin: 0; padding: 0;
            user-select: none;
            overflow-x: hidden;
        }

        /* --- TOP BAR ESTILO APP --- */
        .top-bar {
            width: 100%; padding: 12px 15px;
            display: flex; justify-content: space-between; align-items: center;
            background: #1a1d23; border-bottom: 1px solid #333;
            position: sticky; top: 0; z-index: 1000;
        }
        .logo-text { font-weight: 900; font-size: 18px; color: #fff; }
        .logo-text span { color: var(--green-btn); }
        .balance-display {
            background: #000; border: 1.5px solid var(--gold);
            color: var(--gold); padding: 4px 12px; border-radius: 20px;
            font-weight: bold; font-size: 16px;
        }

        /* --- LOBBY (MENÚ DE JUEGOS) --- */
        .screen { display: none; width: 100%; min-height: 100vh; flex-direction: column; align-items: center; }
        .active-screen { display: flex; }

        .banner-promo {
            width: 90%; background: linear-gradient(45deg, #1e0033, #4a148c);
            margin: 15px 0; border-radius: 15px; padding: 20px;
            text-align: left; border: 1px solid #6a1b9a;
        }

        .game-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 12px; width: 92%; padding-bottom: 30px;
        }
        .game-card {
            background: var(--card-bg); border: 1px solid var(--border-gray);
            border-radius: 15px; padding: 10px; text-align: center;
            position: relative; transition: transform 0.1s;
        }
        .game-card:active { transform: scale(0.95); }
        .game-card img { width: 100%; aspect-ratio: 1/1; border-radius: 10px; object-fit: cover; margin-bottom: 8px; }
        .game-card h4 { margin: 0; font-size: 13px; color: #eee; }
        .hot-label {
            position: absolute; top: 5px; left: 5px; background: #ff3d00;
            font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 5px;
        }

        /* --- PANTALLA DE CARGA (TA DA) --- */
        #loading-screen { background: #000; justify-content: center; }
        .tada-logo { font-size: 45px; font-weight: 900; color: #ff6600; margin-bottom: 20px; }
        .progress-container { width: 65%; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: #00ffff; transition: width 0.2s; }

        /* --- INTERFAZ FRUIT SLOTS REAL --- */
        .slot-board {
            width: 90%; background: #14161b; border: 2px solid #2c2e33;
            border-radius: 20px; padding: 12px; margin-top: 15px;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
        }
        .slot-cell {
            background: #0d0f12; aspect-ratio: 1/1; border-radius: 10px;
            border: 1px solid #222; display: flex; justify-content: center; align-items: center;
        }
        .slot-cell img { width: 80%; height: 80%; object-fit: contain; }
        .win-glow { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); background: #23272e; }

        /* --- CONTROLES INFERIORES --- */
        .control-bar {
            width: 92%; background: #1a1d23; border-radius: 18px;
            margin: 20px 0; padding: 15px; box-sizing: border-box;
            border: 1px solid #333;
        }
        .bet-adjuster {
            display: flex; align-items: center; background: #0d0f12;
            border-radius: 12px; padding: 8px; flex: 1; border: 1px solid #222;
        }
        .btn-math { background: #23262b; border: none; color: white; width: 35px; height: 35px; border-radius: 8px; font-size: 20px; }
        .ir-button {
            background: var(--green-btn); color: #000; border: none;
            width: 75px; height: 75px; border-radius: 15px;
            font-weight: 900; font-size: 20px; margin-left: 10px;
        }

        /* --- MODAL DE PREMIO --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #14161b; width: 80%; border-radius: 25px;
            padding: 30px; border: 2px solid var(--gold); text-align: center;
        }
        .confirm-btn {
            background: var(--gold); color: #000; border: none;
            width: 100%; padding: 14px; border-radius: 12px;
            font-weight: 900; font-size: 18px; margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="lobby" class="screen active-screen">
        <div class="top-bar">
            <div class="logo-text">MONEY<span>MAGNET</span></div>
            <div class="balance-display">$ <span class="bal-txt">1088.00</span></div>
        </div>

        <div class="banner-promo">
            <h3 style="margin:0;">¡Bono de Bienvenida!</h3>
            <p style="margin:5px 0 0; font-size:12px; opacity:0.8;">Recibe +20% en tu primer depósito hoy.</p>
        </div>

        <div class="game-grid">
            <div class="game-card" onclick="startLoading('fruit-slots', 'Fruit Slots')">
                <div class="hot-label">HOT</div>
                <img src="slot.png"> <h4>Fruit Slots</h4>
            </div>
            <div class="game-card" onclick="startLoading('fruit-slots', 'Fortune Gems 2')">
                <img src="https://img.icons8.com/color/96/gem.png">
                <h4>Fortune Gems 2</h4>
            </div>
            <div class="game-card" onclick="alert('Próximamente...')">
                <img src="https://img.icons8.com/color/96/diamond--v1.png">
                <h4>Mines Diamond</h4>
            </div>
            <div class="game-card" onclick="alert('Próximamente...')">
                <img src="https://img.icons8.com/color/96/fish.png">
                <h4>Big Bass Catch</h4>
            </div>
        </div>
    </div>

    <div id="loading-screen" class="screen">
        <div class="tada-logo">Ta Da</div>
        <div class="progress-container">
            <div class="progress-bar" id="p-bar"></div>
        </div>
        <p id="p-txt" style="margin-top:10px; font-size:12px; color:#666;">Cargando... 0%</p>
    </div>

    <div id="fruit-slots" class="screen">
        <div class="top-bar">
            <button onclick="location.reload()" style="background:none; border:none; color:white; font-size:24px;">⬅️</button>
            <div class="balance-display">$ <span class="bal-txt">1088.00</span></div>
        </div>
        <h2 style="color:var(--gold); margin: 15px 0 5px;">Fruit Slots</h2>
        
        <div class="slot-board" id="board">
            </div>

        <div class="control-bar">
            <div style="display:flex; align-items:center;">
                <div class="bet-adjuster">
                    <button class="btn-math" onclick="changeBet(-5)">-</button>
                    <div style="flex:1; text-align:center;">
                        <span style="font-size:18px; font-weight:bold; color:var(--gold);">$ <span id="bet-txt">31</span></span><br>
                        <small style="font-size:9px; color:#666;">Apuesta</small>
                    </div>
                    <button class="btn-math" onclick="changeBet(5)">+</button>
                </div>
                <button class="ir-button" id="ir-btn" onclick="spin()">IR</button>
            </div>
            <p style="margin:10px 0 0; color:var(--gold); font-size:11px; font-weight:bold;">Max $50.00 MXN</p>
        </div>
    </div>

    <div id="win-modal" class="modal">
        <div class="modal-content">
            <h2 style="color:var(--gold); font-size:28px; margin:0;">¡ENHORABUENA!</h2>
            <p style="color:#888; margin:5px 0;">Usted ha ganado</p>
            <h1 style="font-size:45px; margin:15px 0;">+ $<span id="win-txt">0.00</span></h1>
            <button class="confirm-btn" onclick="document.getElementById('win-modal').style.display='none'">CONFIRMAR</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let saldo = 1088.00;
        let apuesta = 31;
        const startTime = localStorage.getItem('mm_start') || Date.now();
        if(!localStorage.getItem('mm_start')) localStorage.setItem('mm_start', startTime);

        function updateUI() {
            document.querySelectorAll('.bal-txt').forEach(el => el.innerText = saldo.toFixed(2));
            document.getElementById('bet-txt').innerText = apuesta;
        }

        function changeBet(v) {
            apuesta += v;
            if(apuesta < 5) apuesta = 5;
            if(apuesta > 50) apuesta = 50;
            updateUI();
        }

        // --- SISTEMA DE CARGA ---
        function startLoading(screenId, name) {
            document.getElementById('lobby').classList.remove('active-screen');
            document.getElementById('loading-screen').classList.add('active-screen');
            
            let p = 0;
            const bar = document.getElementById('p-bar');
            const txt = document.getElementById('p-txt');

            const interval = setInterval(() => {
                p += Math.floor(Math.random()*20)+5;
                if(p >= 100) {
                    p = 100;
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('loading-screen').classList.remove('active-screen');
                        document.getElementById(screenId).classList.add('active-screen');
                        initBoard();
                    }, 400);
                }
                bar.style.width = p + '%';
                txt.innerText = `Cargando recursos... ${p}%`;
            }, 150);
        }

        // --- LÓGICA DE JUEGO ---
        function initBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            for(let i=0; i<16; i++) {
                board.innerHTML += `<div class="slot-cell"><img src="slot.png"></div>`;
            }
        }

        function spin() {
            if(saldo < apuesta) { alert("Saldo insuficiente"); return; }
            saldo -= apuesta;
            updateUI();

            const btn = document.getElementById('ir-btn');
            btn.disabled = true; btn.style.opacity = "0.5";

            const cells = document.querySelectorAll('.slot-cell');
            let count = 0;
            const loop = setInterval(() => {
                cells.forEach(c => c.classList.remove('win-glow'));
                const r = Math.floor(Math.random()*cells.length);
                cells[r].classList.add('win-glow');
                count++;
                if(count > 12) {
                    clearInterval(loop);
                    btn.disabled = false; btn.style.opacity = "1";
                    checkWin();
                }
            }, 80);
        }

        function checkWin() {
            const diff = Date.now() - startTime;
            // Trampa 4 horas: 75% suerte al inicio, 2% al final
            let prob = diff < 3600000 ? 0.75 : (diff < 14400000 ? 0.25 : 0.02);
            
            if(Math.random() < prob) {
                const win = apuesta * (Math.floor(Math.random()*5)+2);
                saldo += win;
                document.getElementById('win-txt').innerText = win.toFixed(2);
                document.getElementById('win-modal').style.display = 'flex';
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
