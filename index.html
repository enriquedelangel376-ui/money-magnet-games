<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONEY MAGNET - Redireccionando...</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            background-color: #0d0d0d;
            color: #d4af37;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            border: 2px solid #d4af37;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            max-width: 80%;
        }
        .spinner {
            border: 4px solid rgba(212, 175, 55, 0.1);
            border-left-color: #d4af37;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 22px; margin: 0; }
        p { color: #888; font-size: 14px; margin-top: 10px; }
        a { color: #d4af37; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧲 MONEY MAGNET</h1>
        <div class="spinner"></div>
        <p>Cargando plataforma oficial BBRBET...</p>
        <p><i>Si no redirecciona en 3 segundos, haz clic <a href="https://www.bbrbet40.com/c-y3lSqyVB?lang=es">aquí</a></i></p>
    </div>

    <script type="text/javascript">
        // Inicializar la WebApp de Telegram correctamente
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand(); // Abre la ventana completa para que no se vea cortada
        }

        // Redirección inmediata y forzada
        function redireccionar() {
            window.location.replace("https://www.bbrbet40.com/c-y3lSqyVB?lang=es");
        }

        // Ejecutar redirección
        setTimeout(redireccionar, 1000);
    </script>

</body>
</html>
