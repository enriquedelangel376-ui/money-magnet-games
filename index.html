<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MONEY MAGNET GAMES 💰</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold: #ffcc00;
            --dark-bg: #0f1216;
            --card-bg: #1a1e23;
            --accent: #bd19d1;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            user-select: none;
        }

        /* Header Estilo Casino */
        .header {
            background-color: var(--card-bg);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d323a;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-weight: bold;
            font-size: 14px;
            color: var(--gold);
        }

        .balance-container {
            background: #000;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
        }

        .balance {
            color: var(--gold);
            font-weight: bold;
            font-size: 18px;
            margin-right: 10px;
        }

        .btn-plus {
            background: linear-gradient(to bottom, var(--accent), #7a128a);
            border: none;
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        /* Grid de Juegos */
        .main-container {
            padding: 15px;
        }

        .banner {
            width: 100%;
            background: linear-gradient(45deg, #1a1e23, #2d323a);
            border-radius: 10px;
            padding: 20px 0;
            margin-bottom: 20px;
            border: 1px solid #3b424b;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #3b424b;
            transition: transform 0.1s;
            cursor: pointer;
        }

        .game-card:active {
            transform: scale(0.95);
            background-color: #2d323a;
        }

        .game-card i {
            font-size: 30px;
            margin-bottom: 5px;
        }

        /* Modal de Ganancia / Pérdida */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e272e, #000);
            width: 80%;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--gold);
            text-align: center;
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }

        .btn-action {
            background: var(--gold);
            color: black;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 20px;
            width: 100%;
        }

        .deposit-needed {
            color: #ff4d4d;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">MONEY MAGNET 🧲</div>
        <div class="balance-container">
            <div class="balance">$ <span id="saldo-txt">500.00</span></div>
            <button class="btn-plus" onclick="showDeposit()">+</button>
        </div>
    </div>

    <div class="main-container">
        <div class="banner">
            <h2 style="margin:0; color: var(--gold);">🎰 SALA VIP</h2>
            <p style="font-size: 12px; opacity: 0.7;">¡Gira y gana en pesos mexicanos!</p>
        </div>

        <div class="grid">
            <div class="game-card" onclick="playGame()">🎰<br>Slots</div>
            <div class="game-card" onclick="playGame()">💎<br>Gems</div>
            <div class="game-card" onclick="playGame()">🃏<br>Poker</div>
            <div class="game-card" onclick="playGame()">🍬<br>Candy</div>
            <div class="game-card" onclick="playGame()">🏹<br>Zeus</div>
            <div class="game-card" onclick="playGame()">👑<br>Empire</div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content" id="modal-body">
            </div>
    </div>

    <script>
        const tele = window.Telegram.WebApp;
        tele.expand();

        let saldo = 500.00;
        const horaInicio = localStorage.getItem('mm_start') || Date.now();
        if(!localStorage.getItem('mm_start')) localStorage.setItem('mm_start', horaInicio);

        function updateDisplay() {
            document.getElementById('saldo-txt').innerText = saldo.toFixed(2);
        }

        function showModal(title, amount, isWin, extraText = "") {
            const modal = document.getElementById('modal');
            const body = document.getElementById('modal-body');
            
            const color = isWin ? "#ffcc00" : "#ff4d4d";
            const sign = isWin ? "+" : "-";

            body.innerHTML = `
                <h2 style="color: ${color}">${title}</h2>
                <p>${extraText}</p>
                <h1 style="font-size: 45px; margin: 10px 0;">${sign} $${amount}</h1>
                <button class="btn-action" onclick="closeModal()">CONFIRMAR</button>
            `;
            modal.style.display = 'flex';
        }

        function showDeposit() {
            const modal = document.getElementById('modal');
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h2 style="color: var(--gold)">RECARGA VIP 💎</h2>
                <p>Para aumentar tu límite de retiro o recargar saldo, contacta a soporte oficial.</p>
                <button class="btn-action" onclick="window.location.href='https://t.me/TuUsuarioSoporte'">IR A SOPORTE</button>
                <button class="btn-action" style="background:transparent; color:white; border:1px solid white; margin-top:10px;" onclick="closeModal()">CERRAR</button>
            `;
            modal.style.display = 'flex';
        }

        function playGame() {
            if (saldo <= 10) {
                showModal("SALDO BAJO", "0.00", false, "No tienes suficiente saldo para jugar. Recarga para continuar.");
                return;
            }

            const transcurrido = Date.now() - horaInicio;
            let prob;

            // LÓGICA DE 4 HORAS
            if (transcurrido < 3600000) prob = 0.85; // Hora 1: Gana 85%
            else if (transcurrido < 7200000) prob = 0.45; // Hora 2: Gana 45%
            else if (transcurrido < 10800000) prob = 0.15; // Hora 3: Gana 15%
            else prob = 0.02; // Hora 4+: Pierde casi siempre

            const win = Math.random() < prob;
            const amount = Math.floor(Math.random() * 250) + 20;

            if (win) {
                saldo += amount;
                showModal("¡ENHORABUENA!", amount, true, "Usted ha ganado");
            } else {
                saldo -= amount;
                if(saldo < 0) saldo = 0;
                showModal("SUERTE PRÓXIMA", amount, false, "Sigue intentando");
            }
            updateDisplay();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        updateDisplay();
    </script>
</body>
</html>
