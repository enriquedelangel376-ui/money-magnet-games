<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MONEY MAGNET CASINO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --primary: #00ff88;
            --gold: #ffcc00;
            --text-light: #c9d1d9;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
            user-select: none;
            overflow-x: hidden;
        }

        /* --- BARRA SUPERIOR --- */
        .header {
            background: #000;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222;
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-weight: 900; font-size: 20px; color: white; letter-spacing: 1px; }
        .logo span { color: var(--primary); }
        .balance {
            background: #111;
            border: 1.5px solid var(--gold);
            padding: 6px 15px;
            border-radius: 20px;
            color: var(--gold);
            font-weight: 900;
            box-shadow: 0 0 10px rgba(255,204,0,0.2);
        }

        /* --- PANTALLAS --- */
        .screen { display: none; width: 100%; min-height: calc(100vh - 60px); flex-direction: column; align-items: center; }
        .active-screen { display: flex; }

        /* --- LOBBY --- */
        .banner {
            width: 90%; background: linear-gradient(45deg, #1a0033, #000);
            margin: 20px 0; border-radius: 15px; padding: 20px;
            border: 1px solid #440088; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .games-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 90%;
        }
        .game-card {
            background: var(--card-bg); border-radius: 15px; padding: 10px; text-align: center;
            border: 1px solid #333; cursor: pointer; transition: transform 0.1s;
        }
        .game-card:active { transform: scale(0.95); }
        .game-card img { width: 100%; aspect-ratio: 1/1; border-radius: 10px; object-fit: cover; background: #000; }
        .game-card h3 { margin: 10px 0 5px; font-size: 14px; color: var(--gold); }

        /* --- JUEGO TRAGAMONEDAS --- */
        .slot-machine {
            background: #111; border: 3px solid #333; border-radius: 20px;
            padding: 15px; width: 85%; margin-top: 20px;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            box-shadow: inset 0 0 20px #000, 0 0 15px rgba(255,204,0,0.1);
        }
        .slot-item {
            background: #222; aspect-ratio: 1/1; border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #111; box-shadow: inset 0 0 10px #000;
        }
        .slot-item img { width: 75%; height: 75%; object-fit: contain; }
        .highlight { border-color: var(--primary); box-shadow: 0 0 15px var(--primary); background: #003311; }

        /* --- CONTROLES DE APUESTA --- */
        .controls {
            width: 90%; background: var(--card-bg); border-radius: 15px;
            padding: 15px; margin-top: 25px; border: 1px solid #333;
        }
        .bet-box {
            display: flex; align-items: center; background: #000;
            border-radius: 10px; padding: 5px; border: 1px solid #222;
        }
        .btn-math { background: #222; color: white; border: none; width: 40px; height: 40px; border-radius: 8px; font-size: 20px; font-weight: bold; }
        .btn-math:active { background: #444; }
        .bet-amount { flex: 1; text-align: center; color: var(--gold); font-size: 22px; font-weight: 900; }
        
        .btn-spin {
            background: linear-gradient(180deg, #00ff88, #00cc6a);
            color: #000; border: none; width: 100%; padding: 15px;
            border-radius: 12px; font-weight: 900; font-size: 22px;
            margin-top: 15px; box-shadow: 0 5px 0 #008844; cursor: pointer;
        }
        .btn-spin:active { transform: translateY(5px); box-shadow: none; }

        /* --- PANTALLA CARGA --- */
        .loader-logo { font-size: 40px; font-weight: 900; color: #ff6600; margin-top: 30vh;}
        .progress-bar { width: 60%; height: 6px; background: #333; border-radius: 3px; margin-top: 20px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #00ffff; }

        /* --- MODAL GANANCIA --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center;
        }
        .modal-box {
            background: #111; width: 80%; border-radius: 20px; padding: 30px;
            border: 2px solid var(--gold); text-align: center;
            box-shadow: 0 0 30px rgba(255,204,0,0.3);
        }
        .modal-box h2 { color: var(--gold); font-size: 30px; margin: 0; font-weight: 900; }
        .win-amount { font-size: 45px; font-weight: 900; margin: 15px 0; color: white; }
        .btn-collect {
            background: var(--gold); color: #000; border: none; width: 100%;
            padding: 15px; border-radius: 10px; font-weight: 900; font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo" id="back-btn" style="display:none;" onclick="goHome()">⬅️ VOLVER</div>
        <div class="logo" id="main-logo">MX<span>BET</span></div>
        <div class="balance">$ <span id="balance">1088.00</span></div>
    </div>

    <div id="lobby" class="screen active-screen animate__animated animate__fadeIn">
        <div class="banner">
            <h2 style="margin:0; color:var(--gold);">Bono de Bienvenida</h2>
            <p style="margin:5px 0 0; font-size:13px; color:var(--text-light);">Invita a tus amigos y gana hasta $500 MXN.</p>
        </div>

        <div style="width: 90%; margin-bottom: 10px; font-weight: bold;">🔥 Juegos Populares</div>
        <div class="games-grid">
            <div class="game-card" onclick="openGame('slots')">
                <img src="https://images.unsplash.com/photo-1596838132731-3301c3fd4317?w=300&q=80" alt="Slots">
                <h3>Fruit Slots</h3>
            </div>
            <div class="game-card" onclick="alert('Próximamente')">
                <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&q=80" alt="Gems">
                <h3>Fortune Gems</h3>
            </div>
        </div>
    </div>

    <div id="loading" class="screen">
        <div class="loader-logo animate__animated animate__pulse animate__infinite">Ta Da</div>
        <div class="progress-bar"><div class="progress-fill" id="p-bar"></div></div>
        <p style="color:#888; font-size: 12px; margin-top:10px;" id="p-text">Cargando imágenes...</p>
    </div>

    <div id="game" class="screen animate__animated animate__fadeIn">
        <h2 style="color:var(--gold); margin-top:20px;">Fruit Slots VIP</h2>
        
        <div class="slot-machine" id="board">
            </div>

        <div class="controls">
            <div style="text-align: center; color: #888; font-size: 12px; margin-bottom: 5px;">Monto de Apuesta (MXN)</div>
            <div class="bet-box">
                <button class="btn-math" onclick="adjustBet(-10)">-</button>
                <div class="bet-amount">$ <span id="bet">10</span></div>
                <button class="btn-math" onclick="adjustBet(10)">+</button>
            </div>
            <button class="btn-spin" id="spin-btn" onclick="playSlots()">GIRAR</button>
        </div>
    </div>

    <div id="win-modal" class="modal">
        <div class="modal-box animate__animated animate__zoomIn">
            <h2>¡GANASTE!</h2>
            <div style="color:#aaa; font-size:14px; margin-top:5px;">Línea completada</div>
            <div class="win-amount">+ $<span id="win-val">0.00</span></div>
            <button class="btn-collect" onclick="document.getElementById('win-modal').style.display='none'">RECOGER</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Variables del Casino
        let balance = 1088.00;
        let bet = 10;
        const startTime = localStorage.getItem('mm_start') || Date.now();
        if(!localStorage.getItem('mm_start')) localStorage.setItem('mm_start', startTime);

        // IMÁGENES REALES PARA LAS FRUTAS (URLs Directas)
        const images = [
            "https://img.icons8.com/color/96/cherry.png",       // Cereza
            "https://img.icons8.com/color/96/watermelon.png",   // Sandía
            "https://img.icons8.com/color/96/lemon.png",        // Limón
            "https://img.icons8.com/color/96/diamond--v1.png",  // Diamante
            "https://img.icons8.com/color/96/bell.png"          // Campana
        ];

        // Actualizar Textos
        function updateUI() {
            document.getElementById('balance').innerText = balance.toFixed(2);
            document.getElementById('bet').innerText = bet;
        }

        function adjustBet(amount) {
            bet += amount;
            if(bet < 10) bet = 10;
            if(bet > 100) bet = 100;
            updateUI();
        }

        // Navegación
        function goHome() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById('lobby').classList.add('active-screen');
            document.getElementById('back-btn').style.display = 'none';
            document.getElementById('main-logo').style.display = 'block';
        }

        function openGame(type) {
            document.getElementById('lobby').classList.remove('active-screen');
            document.getElementById('loading').classList.add('active-screen');
            
            let p = 0;
            let bar = document.getElementById('p-bar');
            let txt = document.getElementById('p-text');
            
            let load = setInterval(() => {
                p += Math.floor(Math.random() * 20) + 10;
                if(p >= 100) {
                    p = 100;
                    clearInterval(load);
                    setTimeout(() => {
                        document.getElementById('loading').classList.remove('active-screen');
                        document.getElementById('game').classList.add('active-screen');
                        document.getElementById('back-btn').style.display = 'block';
                        document.getElementById('main-logo').style.display = 'none';
                        buildBoard();
                    }, 300);
                }
                bar.style.width = p + '%';
                txt.innerText = `Cargando imágenes... ${p}%`;
            }, 150);
        }

        // Construir Tablero (9 cuadros)
        function buildBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            for(let i=0; i<9; i++) {
                let randomImg = images[Math.floor(Math.random() * images.length)];
                board.innerHTML += `<div class="slot-item"><img src="${randomImg}"></div>`;
            }
        }

        // ANIMACIÓN DE GIRAR LAS IMÁGENES
        function playSlots() {
            if(balance < bet) { alert("Saldo insuficiente"); return; }
            balance -= bet;
            updateUI();

            const btn = document.getElementById('spin-btn');
            btn.disabled = true; btn.style.background = "#555"; btn.innerText = "...";

            const cells = document.querySelectorAll('.slot-item img');
            const containers = document.querySelectorAll('.slot-item');
            
            // Quitar luces de ganancia anterior
            containers.forEach(c => c.classList.remove('highlight'));

            let spins = 0;
            // Intervalo que cambia las imágenes muy rápido (Efecto de giro real)
            const spinAnimation = setInterval(() => {
                cells.forEach(img => {
                    img.src = images[Math.floor(Math.random() * images.length)];
                });
                spins++;

                if(spins > 15) { // Después de 15 cambios, se detiene
                    clearInterval(spinAnimation);
                    btn.disabled = false; 
                    btn.style.background = "linear-gradient(180deg, #00ff88, #00cc6a)"; 
                    btn.innerText = "GIRAR";
                    checkWin(containers);
                }
            }, 100); // Velocidad del giro
        }

        // Lógica de Ganancia (La Trampa)
        function checkWin(containers) {
            const diff = Date.now() - startTime;
            let prob = diff < 3600000 ? 0.75 : (diff < 14400000 ? 0.25 : 0.02); // Trampa de 4 horas
            
            if(Math.random() < prob) {
                // Forzar que 3 imágenes sean iguales para que visualmente se vea que ganó
                let winImg = images[Math.floor(Math.random() * images.length)];
                
                // Iluminar la fila del medio (Celdas 3, 4 y 5)
                for(let i=3; i<=5; i++) {
                    containers[i].querySelector('img').src = winImg;
                    containers[i].classList.add('highlight');
                }

                // Calcular premio
                const win = bet * (Math.floor(Math.random() * 5) + 2); // Multiplica x2 hasta x6
                balance += win;
                
                setTimeout(() => {
                    document.getElementById('win-val').innerText = win.toFixed(2);
                    
                    // Reiniciar animación del modal
                    let modalBox = document.querySelector('.modal-box');
                    modalBox.classList.remove('animate__zoomIn');
                    void modalBox.offsetWidth;
                    modalBox.classList.add('animate__zoomIn');
                    
                    document.getElementById('win-modal').style.display = 'flex';
                    updateUI();
                }, 500); // Medio segundo después de detenerse
            }
        }

        updateUI();
    </script>
</body>
</html>
