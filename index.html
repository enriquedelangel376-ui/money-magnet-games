<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONEY MAGNET - Redirigiendo...</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            background-color: #0d0d0d;
            color: #d4af37;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader-container {
            border: 2px solid #d4af37;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }
        .spinner {
            border: 4px solid rgba(212, 175, 55, 0.1);
            border-left-color: #d4af37;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 { font-size: 24px; margin: 10px 0; }
        p { color: #888; font-size: 14px; }
    </style>
</head>
<body>

    <div class="loader-container">
        <h1>🧲 MONEY MAGNET</h1>
        <div class="spinner"></div>
        <p>Cargando plataforma oficial BBRBET...</p>
        <p><i>Si no redirige, haz clic <a href="https://www.bbrbet40.com/c-y3lSqyVB?lang=es" style="color:#d4af37;">aquí</a></i></p>
    </div>

    <script type="text/javascript">
        // Inicializar WebApp de Telegram
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        // Redirección Automática
        setTimeout(function() {
            window.location.href = "https://www.bbrbet40.com/c-y3lSqyVB?lang=es";
        }, 1500); // 1.5 segundos de espera para asegurar que el script cargue
    </script>

</body>
</html>
